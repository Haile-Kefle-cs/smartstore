<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - SmartStore</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tables.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h2>Supplier Management</h2>
            <button class="btn btn-primary" onclick="showAddSupplierModal()">
                + Add Supplier
            </button>
        </div>

        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="supplier-search" class="form-control" placeholder="Search suppliers...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="table-container">
            <table class="table" id="suppliers-table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Contact Person</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Products Supplied</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliers-tbody">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
