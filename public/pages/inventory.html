<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - SmartStore</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tables.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h2>Inventory Management</h2>
            <button class="btn btn-primary" onclick="showStockAdjustModal()">
                Adjust Stock
            </button>
        </div>

        <div class="inventory-summary">
            <div class="summary-card">
                <h3>Total Items</h3>
                <p id="total-items">0</p>
            </div>
            <div class="summary-card">
                <h3>Total Value</h3>
                <p id="total-value">$0.00</p>
            </div>
            <div class="summary-card">
                <h3>Low Stock</h3>
                <p id="low-stock-count">0</p>
            </div>
            <div class="summary-card">
                <h3>Out of Stock</h3>
                <p id="out-of-stock">0</p>
            </div>
        </div>

        <div class="table-container">
            <table class="table" id="inventory-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>SKU</th>
                        <th>Current Stock</th>
                        <th>Reorder Level</th>
                        <th>Status</th>
                        <th>Last Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-tbody">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </div>

        <!-- Stock Movement History -->
        <div class="movement-history">
            <h3>Recent Stock Movements</h3>
            <div class="table-container">
                <table class="table" id="movements-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Product</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="movements-tbody">
                        <!-- Dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
