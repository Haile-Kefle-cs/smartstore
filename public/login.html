<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መግቢያ | Login - ስማርት ስቶር</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Nyala', 'Noto Sans Ethiopic', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .language-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .lang-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .lang-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-logo { font-size: 60px; margin-bottom: 15px; }
        .login-header h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .login-header p { color: #666; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; font-size: 14px; }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-control:focus { outline: none; border-color: #667eea; }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
        }
        .btn-login:hover { background: #5a67d8; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        
        .demo-credentials {
            margin-top: 25px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
        }
        .demo-credentials h4 { font-size: 13px; color: #666; margin-bottom: 10px; }
        .credential-item {
            padding: 8px;
            margin-bottom: 5px;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        .credential-item:hover { background: #edf2f7; }
    </style>
</head>
<body>
    <div class="language-toggle">
        <button class="lang-btn active" onclick="setLanguage('am')">አማርኛ</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <a href="/" class="back-link" id="backLink">← ወደ መነሻ ተመለስ</a>
            
            <div class="login-header">
                <div class="login-logo">🏪</div>
                <h1 id="loginTitle">ስማርት ስቶር</h1>
                <p id="loginSubtitle">ወደ መለያዎ ይግቡ</p>
            </div>
            
            <div id="login-alert" class="alert alert-error"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" id="emailLabel">ኢሜይል አድራሻ</label>
                    <input type="email" id="email" class="form-control" placeholder="ኢሜይልዎን ያስገቡ" required>
                </div>
                
                <div class="form-group">
                    <label for="password" id="passwordLabel">የይለፍ ቃል</label>
                    <input type="password" id="password" class="form-control" placeholder="የይለፍ ቃልዎን ያስገቡ" required>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">ግባ</button>
            </form>
            
            <div class="demo-credentials">
                <h4 id="demoTitle">የሙከራ መለያዎች (ለመሙላት ይጫኑ):</h4>
                <div class="credential-item" onclick="fillCredentials('admin@smartstore.com', 'admin123')">
                    <strong>አስተዳዳሪ:</strong> admin@smartstore.com / admin123
                </div>
                <div class="credential-item" onclick="fillCredentials('manager@smartstore.com', 'manager123')">
                    <strong>ሥራ አስኪያጅ:</strong> manager@smartstore.com / manager123
                </div>
                <div class="credential-item" onclick="fillCredentials('cashier@smartstore.com', 'cashier123')">
                    <strong>ሒሳብ ባለሙያ:</strong> cashier@smartstore.com / cashier123
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('lang') || 'am';
        
        const translations = {
            am: {
                backLink: '← ወደ መነሻ ተመለስ',
                title: 'ስማርት ስቶር',
                subtitle: 'ወደ መለያዎ ይግቡ',
                emailLabel: 'ኢሜይል አድራሻ',
                emailPlaceholder: 'ኢሜይልዎን ያስገቡ',
                passwordLabel: 'የይለፍ ቃል',
                passwordPlaceholder: 'የይለፍ ቃልዎን ያስገቡ',
                loginBtn: 'ግባ',
                loggingIn: 'በመግባት ላይ...',
                demoTitle: 'የሙከራ መለያዎች (ለመሙላት ይጫኑ):',
                admin: 'አስተዳዳሪ',
                manager: 'ሥራ አስኪያጅ',
                cashier: 'ሒሳብ ባለሙያ'
            },
            en: {
                backLink: '← Back to Home',
                title: 'SmartStore',
                subtitle: 'Login to your account',
                emailLabel: 'Email Address',
                emailPlaceholder: 'Enter your email',
                passwordLabel: 'Password',
                passwordPlaceholder: 'Enter your password',
                loginBtn: 'Login',
                loggingIn: 'Logging in...',
                demoTitle: 'Demo Credentials (Click to fill):',
                admin: 'Admin',
                manager: 'Manager',
                cashier: 'Cashier'
            }
        };
        
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            
            if (lang === 'am') {
                document.querySelectorAll('.lang-btn')[0].classList.add('active');
                document.documentElement.lang = 'am';
            } else {
                document.querySelectorAll('.lang-btn')[1].classList.add('active');
                document.documentElement.lang = 'en';
            }
            
            applyTranslations();
        }
        
        function applyTranslations() {
            const t = translations[currentLang];
            document.getElementById('backLink').textContent = t.backLink;
            document.getElementById('loginTitle').textContent = t.title;
            document.getElementById('loginSubtitle').textContent = t.subtitle;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('email').placeholder = t.emailPlaceholder;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('password').placeholder = t.passwordPlaceholder;
            document.getElementById('loginBtn').textContent = t.loginBtn;
            document.getElementById('demoTitle').textContent = t.demoTitle;
            
            document.querySelectorAll('.credential-item strong').forEach((el, index) => {
                if (index === 0) el.textContent = t.admin + ':';
                if (index === 1) el.textContent = t.manager + ':';
                if (index === 2) el.textContent = t.cashier + ':';
            });
        }
        
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn') || document.getElementById('loginBtn');
            const alertDiv = document.getElementById('login-alert');
            
            loginBtn.disabled = true;
            loginBtn.textContent = translations[currentLang].loggingIn;
            alertDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }
                
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                
                window.location.href = '/dashboard';
            } catch (error) {
                alertDiv.textContent = error.message;
                alertDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = translations[currentLang].loginBtn;
            }
        });
        
        // Initialize
        setLanguage(currentLang);
    </script>
</body>
</html>
